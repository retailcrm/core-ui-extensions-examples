yarnPath: .yarn/releases/yarn-3.7.0.cjs

nodeLinker: node-modules

logFilters:
  - code: YN0013
    level: discard
  - code: YN0019
    level: discard

packageExtensions:
  "@omnicajs/eslint-plugin-dependencies@*":
    peerDependencies:
      typescript: ">=4.8.4 <6.0.0"
  "vue3-perfect-scrollbar@*":
    dependencies:
      postcss: "^8.5.3"
